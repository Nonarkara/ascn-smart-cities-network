name: Check Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run already measuring the old one.
concurrency:
  group: check-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The scope step diffs the push's previous commit, or the pull
          # request's base, and both have to be in this checkout.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-scope.mjs
      # An empty output must fail the job. Skipping both gates would report
      # a green verify that measured nothing.
      - name: Scope must choose a gate
        run: |
          case "${{ steps.scope.outputs.visual }}" in
            true|false) echo "visual=${{ steps.scope.outputs.visual }}" ;;
            *) echo "check-scope did not set visual=true or visual=false"; exit 1 ;;
          esac
      - run: npm ci
      - name: Install Playwright
        if: steps.scope.outputs.visual == 'true'
        run: npx playwright install --with-deps chromium
      - name: Full release gate
        if: steps.scope.outputs.visual == 'true'
        run: npm run check:release
      - name: Data-only check
        if: steps.scope.outputs.visual == 'false'
        run: |
          npm audit --audit-level=high
          npm run check
